name: SonarCloud Scan

on:
  push:
  pull_request:

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Recomendo manter na v4 (versão estável atual)
        with:
          fetch-depth: 0  

      - name: Configurar Python
        uses: actions/setup-python@v5 # Recomendo manter na v5 (versão estável atual)
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: SonarCloud Scan
        # Atualizado para a nova action oficial para evitar o warning de 'deprecated'
        uses: SonarSource/sonarqube-scan-action@v5.0.0 
        env:
          SONAR_TOKEN: ${{ secrets.CROH_NET_SECRET }}
        with:
          args: >
            -Dsonar.projectKey=Felipe-CF_CrohnNet
            -Dsonar.organization=fcf230800
            -Dsonar.python.version=3.10