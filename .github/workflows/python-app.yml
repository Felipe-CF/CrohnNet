# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: "pip"
        cache-dependency-path: 'requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    # - name: Lint with flake8
    #   run: |
    #     pip install flake8
    #     # Removemos o --select para ele checar TUDO (Estilo PEP 8 completo)
    #     # O default do flake8 já segue o padrão oficial do Python
    #     flake8 . --count --show-source --statistics

    - name: Test with pytest
      run: |
        pip install pytest
        pytest || true
    
    - name: Install UML
      run: |
          pip install django-extensions pydotplus graphviz
          sudo apt-get update
          sudo apt-get install -y graphviz

    - name: Diagram UML
      run: |
          python manage.py graph_models -a -g -o diagram.png
    
    - name: Save UML
      uses: actions/upload-artifact@v5
      with:
        name: uml-diagram
        path: diagram.png
